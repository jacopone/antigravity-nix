name: Update Google Antigravity

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the update PR

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        env:
          DISABLE_FLAKEHUB: "true"
        with:
          flakehub: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main



      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run update script
        id: update
        run: |
          chmod +x scripts/update-version.sh

          # Capture output and show it for debugging
          if ./scripts/update-version.sh 2>&1 | tee update_output.txt; then
            echo "update_success=true" >> $GITHUB_OUTPUT

            # Check if versions.json was modified
            if git diff --quiet artifacts/versions.json; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              extract_version() { jq -r ".\"$1\".\"x86_64-linux\".url" artifacts/versions.json | grep -oP '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+'; }
              APP_VERSION=$(extract_version "Antigravity 2.0")
              IDE_VERSION=$(extract_version "Antigravity IDE")
              CLI_VERSION=$(extract_version "Antigravity CLI")
              # The 2.0 app is the flagship/default; track its version for the branch + release tag.
              echo "Detected versions — app: $APP_VERSION, ide: $IDE_VERSION, cli: $CLI_VERSION"
              echo "new_version=$APP_VERSION" >> $GITHUB_OUTPUT
              echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
              echo "ide_version=$IDE_VERSION" >> $GITHUB_OUTPUT
              echo "cli_version=$CLI_VERSION" >> $GITHUB_OUTPUT
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "update_success=false" >> $GITHUB_OUTPUT
            echo "=== Update script failed ==="
            cat update_output.txt
            exit 1
          fi

      - name: Verify packages build
        if: steps.update.outputs.has_changes == 'true'
        run: |
          echo "Running flake check..."
          nix flake check
          echo "Building updated packages (verifies the new hashes before opening a PR)..."
          # The no-FHS IDE patches the agy extension and fails the build when
          # an IDE release moves the patch anchors (issue #145).
          nix build .#default .#google-antigravity-ide .#google-antigravity-ide-no-fhs .#google-antigravity-cli --no-link --print-build-logs

      - name: Create Pull Request
        id: cpr
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update antigravity (app ${{ steps.update.outputs.app_version }}, ide ${{ steps.update.outputs.ide_version }}, cli ${{ steps.update.outputs.cli_version }})"
          title: "chore: update antigravity (app ${{ steps.update.outputs.app_version }}, ide ${{ steps.update.outputs.ide_version }}, cli ${{ steps.update.outputs.cli_version }})"
          body: |
            ## Google Antigravity Update

            This PR updates the Google Antigravity Nix flake packages.
            
            Detected versions:
            - **Antigravity 2.0 app** (`default`): `${{ steps.update.outputs.app_version }}`
            - **Antigravity IDE**: `${{ steps.update.outputs.ide_version }}`
            - **Antigravity CLI** (`agy`): `${{ steps.update.outputs.cli_version }}`

            ### Changes
            - Updated versions and hashes in `artifacts/versions.json`

            ### Testing
            - ✅ Built successfully
            - ✅ Flake checks passed

            ### Changelog
            See: https://antigravity.google/releases

            ---
            🤖 This PR was created automatically by the auto-update workflow.
          branch: auto-update/antigravity-${{ steps.update.outputs.new_version }}
          delete-branch: true
          labels: |
            automated
            antigravity-update

      # Bot-opened PRs only run `pull_request` workflows after a user with write
      # access approves them, so CI never runs on these PRs by itself. A
      # workflow_dispatch from GITHUB_TOKEN does run, and its checks land on the
      # PR head commit, where the master ruleset requires them. The merge
      # happens here, not through auto-merge, because release.yml fires when
      # this workflow completes and must find the new versions on master.
      - name: Run CI on the PR and merge it
        if: steps.update.outputs.has_changes == 'true'
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ] || [ -z "$BRANCH" ]; then
            echo "::error::create-pull-request returned no PR (number='$PR_NUMBER' sha='$HEAD_SHA' branch='$BRANCH')"
            exit 1
          fi

          # A reused branch can already carry a CI run for this commit, so
          # remember those and wait for the one this dispatch creates.
          ci_runs() {
            gh run list --workflow ci.yml --event workflow_dispatch --branch "$BRANCH" --limit 50 \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId"
          }
          BEFORE=$(ci_runs)
          gh workflow run ci.yml --ref "$BRANCH"

          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 10
            RUN_ID=$(ci_runs | grep -vxF -e "$BEFORE" -e "" | head -n1 || true)
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run appeared for $HEAD_SHA on $BRANCH after dispatch"
            exit 1
          fi
          echo "CI run for PR #$PR_NUMBER: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$RUN_ID"

          if ! gh run watch "$RUN_ID" --exit-status --interval 30 > /dev/null; then
            gh run view "$RUN_ID"
            echo "::error::CI failed for PR #$PR_NUMBER; the PR stays open"
            exit 1
          fi

          # The ruleset can take a moment to see the finished checks.
          for _ in 1 2 3; do
            if gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"; then
              echo "✓ Merged PR #$PR_NUMBER"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Could not merge PR #$PR_NUMBER after CI passed"
          exit 1

      - name: Report status
        if: always()
        env:
          UPDATE_SUCCESS: ${{ steps.update.outputs.update_success }}
          HAS_CHANGES: ${{ steps.update.outputs.has_changes }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        run: |
          if [[ "$UPDATE_SUCCESS" == "true" ]]; then
            if [[ "$HAS_CHANGES" == "true" ]]; then
              echo "✅ Update successful! New version: $NEW_VERSION"
            else
              echo "✅ Already at latest version"
            fi
          else
            echo "❌ Update failed"
            exit 1
          fi
