name: Probe CI dispatch (temporary)

# Throwaway: checks that a CI run dispatched with GITHUB_TOKEN starts without
# approval and reports its checks on the branch head. Removed before merge.
on:
  push:
    branches: [ci/bot-pr-ci-gate]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
